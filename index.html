<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23a8d5b5'/%3E%3Cpath d='M12 9l12 7-12 7z' fill='%23173a25'/%3E%3C/svg%3E" />
    <title>StoryCut Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // If the app has not started after a while (old cached page, blocked script, very old browser), say so instead of showing a blank page.
      setTimeout(function () {
        var r = document.getElementById('root');
        if (r && !r.children.length) r.innerHTML = '<div style="max-width:560px;margin:12vh auto;padding:24px;font-family:system-ui,sans-serif;border:1px solid #dfe7e1;border-radius:14px">' +
          '<h2 style="margin-top:0">StoryCut Studio did not start</h2><p>Press <b>Ctrl + Shift + R</b> (Mac: Cmd + Shift + R) to reload the newest version. ' +
          'If it stays blank, use a recent Chrome or Edge.</p><button onclick="location.reload()" style="padding:10px 18px;border-radius:10px;border:0;background:#4f8f63;color:#fff;font-size:15px">↻ Reload</button></div>';
      }, 10000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
