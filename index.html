<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23a8d5b5'/%3E%3Cpath d='M12 9l12 7-12 7z' fill='%23173a25'/%3E%3C/svg%3E" />
    <title>StoryCut Studio</title>
      <script>
      // A freshly published version replaces the old files. If this page is an old cached copy whose
      // files are gone, load the newest version once (with a fresh address so no cache is used).
      (function () {
        function fresh() {
          var k = 'sc-fresh-load', last = +(sessionStorage.getItem(k) || 0);
          if (Date.now() - last < 20000) return false;
          sessionStorage.setItem(k, String(Date.now()));
          var u = new URL(location.href); u.searchParams.set('v', String(Date.now())); location.replace(u.toString());
          return true;
        }
        window.__scFresh = fresh;
        window.addEventListener('error', function (e) {
          var t = e.target;
          if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK') && /\/assets\//.test(t.src || t.href || '')) fresh();
        }, true);
        setTimeout(function () {
          var r = document.getElementById('root');
          if (r && !r.children.length && !fresh()) r.innerHTML = '<div style="max-width:560px;margin:12vh auto;padding:24px;font-family:system-ui,sans-serif;border:1px solid #dfe7e1;border-radius:14px">' +
            '<h2 style="margin-top:0">StoryCut Studio did not start</h2><p>A new version may have just been published. Press the button to load it. ' +
            'If it stays blank, press <b>Ctrl + Shift + R</b>, or use a recent Chrome or Edge.</p><button onclick="sessionStorage.removeItem(\'sc-fresh-load\');window.__scFresh()" style="padding:10px 18px;border-radius:10px;border:0;background:#4f8f63;color:#fff;font-size:15px">↻ Load newest version</button></div>';
        }, 6000);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
